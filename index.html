<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101512">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>柿子姿态识别</title>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>柿子姿态识别</h1>
        <p id="status">点击“启动摄像头”开始</p>
      </div>
      <span id="fps">-- FPS</span>
    </header>

    <section id="viewer">
      <video id="camera" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="empty">使用 iPad 后置摄像头<br><small>所有识别均在本机完成</small></div>
    </section>

    <section class="controls">
      <button id="start">启动摄像头</button>
      <button id="stop" disabled>停止</button>
      <label>最低置信度 <output id="confidenceValue">0.65</output>
        <input id="confidence" type="range" min="0.30" max="0.95" step="0.05" value="0.65">
      </label>
    </section>

    <footer>
      <span><i class="calyx"></i>柿蒂</span>
      <span><i class="tip"></i>柿尖</span>
      <span>箭头：柿蒂 → 柿尖</span>
    </footer>
  </main>
  <canvas id="inputCanvas" width="640" height="640" hidden></canvas>
  <script src="ort.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
